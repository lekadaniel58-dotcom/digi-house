<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGI HOUSE | Promozioni</title><meta name="description" content="Offerte e promozioni DIGI HOUSE pubblicate su Facebook."><link rel="stylesheet" href="reparto.css"><style>.promo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin:30px 0 70px}.promo-card{background:white;border:1px solid #ddd;border-radius:14px;overflow:hidden}.promo-card img{width:100%;height:230px;object-fit:contain;background:#f6f6f6}.promo-card div{padding:20px}.promo-card p{white-space:pre-line;overflow-wrap:anywhere}.promo-card a{display:inline-block;margin-top:14px;color:#003366;font-weight:700}</style></head><body><header class="reparto-header"><div class="container header-row"><a class="brand" href="index.html"><span class="brand-word">DIGI HOUSE</span></a><a class="back-link" href="index.html#offerte">Torna al sito</a></div></header><main><section class="reparto-hero"><div class="container"><div class="eyebrow">DIGI HOUSE · Offerte</div><h1>Promozioni <em>del momento</em></h1><p>Le offerte che pubblichiamo su Facebook con #PromoDigiHouse.</p></div></section><section class="reparto-main"><div class="container"><div id="promozioni" class="promo-grid" aria-live="polite"></div><p id="stato">Caricamento promozioni…</p></div></section></main><script>
(async()=>{const list=document.getElementById('promozioni'),status=document.getElementById('stato');try{const response=await fetch('promozioni-facebook.json',{cache:'no-cache'});if(!response.ok)throw new Error('Caricamento non riuscito');const posts=await response.json();status.textContent=posts.length?'':'Le promozioni Facebook saranno visibili qui dopo l’attivazione della sincronizzazione.';for(const post of posts){const card=document.createElement('article');card.className='promo-card';if(post.image&&/^https:\/\//.test(post.image)){const img=document.createElement('img');img.src=post.image;img.alt='Promozione DIGI HOUSE';img.loading='lazy';card.appendChild(img)}const body=document.createElement('div');const p=document.createElement('p');p.textContent=post.text||'Offerta DIGI HOUSE';body.appendChild(p);if(post.url&&/^https:\/\//.test(post.url)){const a=document.createElement('a');a.href=post.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Vedi offerta su Facebook ↗';body.appendChild(a)}card.appendChild(body);list.appendChild(card)}}catch(e){status.textContent='Promozioni temporaneamente non disponibili.'}})();
</script></body></html>
